/* Layout: one column. Summary strip on top, a "Needs you" list for the next action, then the pipeline lanes. */
/* Colors and type use the tokens above. */
:root{
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --bg:var(--pd-color-basic-white);--fg:var(--pd-color-secondary-dark);--mute:var(--pd-color-secondary-lighter);
  --line:var(--pd-color-tertiary-dark);--card:var(--pd-color-tertiary-light);
  --accent:var(--pd-color-primary-main);--accent-fg:var(--pd-color-basic-white);--accent-hover:var(--pd-color-primary-dark);
  --ok:var(--pd-color-primary-main);--warn:var(--pd-color-warning-dark);--bad:var(--pd-color-danger-dark);
  --smart:var(--pd-color-smart-main);--focus:var(--pd-color-accent-main);--blue:var(--pd-color-accent-main);
  --shadow:0 8px 24px rgba(0,0,0,.14);--scrim:rgba(20,24,22,.42);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#222624;--fg:#f0f3f1;--mute:#abb5af;--line:#454d48;--card:#2d332f;--accent:#57c69d;--accent-fg:#13261e;--accent-hover:#7ad8b5;
  --ok:#57c69d;--warn:#ecc482;--bad:#ffaaa0;--smart:#b8a3f5;--focus:#8cb9ff;--blue:#8cb9ff;--shadow:0 8px 24px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#222624;--fg:#f0f3f1;--mute:#abb5af;--line:#454d48;--card:#2d332f;--accent:#57c69d;--accent-fg:#13261e;--accent-hover:#7ad8b5;
  --ok:#57c69d;--warn:#ecc482;--bad:#ffaaa0;--smart:#b8a3f5;--focus:#8cb9ff;--blue:#8cb9ff;--shadow:0 8px 24px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:20px;font-synthesis:none;-webkit-font-smoothing:antialiased;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:18px;line-height:26px;letter-spacing:-.2px}
h2{font-size:16px;line-height:24px}
h3{font-size:14px;line-height:20px}
p{margin:0}
[hidden]{display:none!important}
#banner:empty,#answer:empty{display:none}
.sub{font-size:12px;line-height:18px;color:var(--mute)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grow{flex:1}

/* controls */
button,input,textarea,select{font:inherit;color:var(--fg)}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:32px;padding:5px 12px;border-radius:4px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;transition:background-color .15s,border-color .15s}
button:hover:not(:disabled){background:var(--card);border-color:var(--pd-color-tertiary-darker)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{min-height:40px;padding:9px 16px;background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
button.text-button{border-color:transparent;background:transparent;color:var(--mute)}
button.text-button:hover:not(:disabled){background:var(--card);color:var(--fg)}
:is(button,a,input,select,textarea,summary):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=text],input[type=search],input[type=number],textarea{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:8px 12px;min-width:0}
input::placeholder,textarea::placeholder{color:var(--mute)}
textarea{width:100%;resize:vertical}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none;margin:0}
.pd-icon{width:16px;height:16px;fill:currentColor;flex:none}
.plain-btn,.card-main,.row-main{align-items:flex-start;border:0;background:none;padding:0;min-height:0;text-align:left;font-weight:400;display:flex;width:100%;justify-content:flex-start}
.card-main:hover:not(:disabled),.row-main:hover:not(:disabled){background:none}
.pd-button-link{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:5px 12px;border:1px solid var(--line);border-radius:4px;font-weight:600;color:var(--fg);text-decoration:none}
.pd-button-link:hover{background:var(--card)}
.inline{display:inline-flex;align-items:center;gap:8px;font-size:13px}

/* header: sticky command bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:12px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{color:var(--fg);flex:none}
.brand svg{display:block;width:100px;height:26px}
.titles{display:flex;flex-direction:column;min-width:0}
.top-tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top-tools #search{width:160px;min-height:32px;padding:4px 12px}
.mode{gap:8px}
.mode::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--smart)}
.mode[data-mode=live]::before{background:var(--ok)}
kbd{font:inherit;font-size:11px;line-height:16px;padding:0 5px;border:1px solid var(--line);border-radius:4px;color:var(--mute);background:var(--card);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px;background:var(--card)}
.seg button{min-height:28px;padding:2px 12px;border:0;background:transparent;color:var(--mute);border-radius:4px}
.seg button:hover:not(:disabled){background:transparent;color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.sm button{min-height:24px;padding:0 10px;font-size:12px}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;background:color-mix(in srgb,var(--warn) 10%,var(--bg))}

/* Ask Claude */
.ask{display:flex;flex-direction:column;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--smart) 5%,var(--bg))}
.ask-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ask-form input{flex:1 1 280px;min-height:40px}
.ai-mark{display:inline-flex;align-items:center;gap:6px;color:var(--smart);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:28px;padding:3px 10px;font-size:12px;font-weight:400;color:var(--mute)}
.chip.doc{color:var(--fg);font-weight:600}
.answer{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--smart) 5%,var(--bg))}
.answer.err-box{flex-direction:row;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--bad) 8%,var(--bg))}
.ans-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.think{color:var(--smart);font-weight:600}
.lead{font-size:14px;line-height:22px;max-width:75ch}
.brief{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.brief li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.brief li>div:first-child{flex:1 1 280px;min-width:0}
.brief p{color:var(--mute)}
.brief em{color:var(--fg);font-style:normal}

/* KPI strip: tiles are shortcuts into a filtered view */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;padding:14px 18px;min-width:0;border:0;border-left:1px solid var(--line);border-radius:0;background:none;text-align:left;font-weight:400;min-height:0}
.kpi:first-child{border-left:0}
button.kpi:hover:not(:disabled){background:var(--card)}
.k-label{font-size:12px;line-height:18px;color:var(--mute)}
.kpi strong{font-size:20px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.k-sub{font-size:12px;line-height:18px;color:var(--mute)}
.kpi.warn strong{color:var(--warn)}
.kpi.good strong{color:var(--ok)}
@media (max-width:640px){.kpi{border-left:0;border-top:1px solid var(--line)}.kpi:first-child{border-top:0}}

/* section heads */
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sec-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.count{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--card);font-size:12px;line-height:22px;font-weight:600;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
.rules summary{cursor:pointer;color:var(--mute);font-size:13px;list-style:none;padding:4px 8px;border-radius:4px}
.rules summary:hover{background:var(--card);color:var(--fg)}
.rules{position:relative}
.rule-grid{position:absolute;right:0;top:100%;z-index:5;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);box-shadow:var(--shadow);width:max-content;max-width:90vw}
.rule-grid label{display:flex;gap:8px;align-items:center;font-size:13px}
.rule-grid input{width:64px;padding:4px 8px}

/* Focus queue */
.grp{margin-bottom:20px}
.grp-head{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 0}
.grp-head .sub{min-width:0}
.panel{border:1px solid var(--line);border-radius:8px;padding:16px}
.clear{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.needs-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--bg)}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.row.t-bad::before{background:var(--bad)}.row.t-warn::before{background:var(--warn)}.row.t-mute::before{background:var(--pd-color-tertiary-darker)}
.row:hover,.row.cur{background:var(--card)}
.row.cur{outline:2px solid var(--focus);outline-offset:-2px}
.row.sel{background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.row.hi{box-shadow:inset 0 0 0 2px var(--smart)}
.row.start{background:color-mix(in srgb,var(--accent) 5%,var(--bg))}
.row-main{flex:1 1 240px;min-width:0;flex-direction:column;gap:0}
.r-name{overflow-wrap:anywhere}
.r-name strong{font-weight:600}
.dim{color:var(--mute)}
.val{font-variant-numeric:tabular-nums;font-weight:600;min-width:72px;text-align:right}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .snz{opacity:0}
.row:hover .snz,.row.cur .snz,.row .snz:focus-visible{opacity:1}
.more{margin:4px 0 8px}
.needs-list .more{margin:0;border-radius:0;justify-content:flex-start;border-top:1px solid var(--line);padding:8px 16px}
.quiet .needs-list{margin-top:8px}
.snz-toggle{margin-top:4px}
.empty{color:var(--mute);padding:12px 0}
.empty.small{padding:8px 0;font-size:12px}
